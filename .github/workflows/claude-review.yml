name: claude-review

# Agentic PR review via anthropics/claude-code-action. Full rationale in
# decisions/016-claude-code-action-pr-review.md.
#
# This is an ADVISORY lane, not a gate: it posts review comments and never fails the
# build. tests.yml and evals.yml are the gates; a model's opinion is not one, and a
# red X from a non-deterministic reviewer would train the habit of ignoring red Xs.
#
# ON DEMAND ONLY, as of 2026-07-26 (ADR-016 Amendment 1). There is no automatic
# trigger: this lane fires when the owner comments @claude on a PR, and at no other
# time. It costs nothing when idle.
#
# The progression is recorded because the reasoning changed twice, both times on
# measurement. `synchronize` was rejected up front -- a charge per push and a stream
# of near-duplicate comments on unfinished work. `pull_request: [opened]` was the
# compromise that replaced it: one automatic pass per PR. That is what has now been
# dropped. It was never the wrong design; it stopped being worth its recurring price
# once the lane worked well enough to run on every PR, which is the only reason it
# ever cost anything at all.
#
# Deliberately does NOT use pull_request_target -- that trigger runs untrusted fork
# code in the base repo's context WITH secrets. Moot for the comment path (which
# always runs in the base context), retained as a standing prohibition so a future
# PR-triggered lane does not reintroduce it.
on:
  # The only trigger. WITHOUT this the @claude phrase does nothing -- trigger_phrase
  # only matches once an event delivers the comment.
  issue_comment:
    types: [created]

# pull-requests: write is what lets the action post the review; contents/issues are read
# scopes it needs for diff and PR context. No `contents: write` -- this lane comments,
# it never pushes.
#
# id-token: write is NOT optional: the action exchanges a GitHub OIDC token for its App
# token, and without this scope it fails at setupGitHubToken with "Unable to get
# ACTIONS_ID_TOKEN_REQUEST_URL" before ever reaching the model. It grants the ability to
# mint an OIDC identity token for this repo, not write access to repo contents.
permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    # One event, and it is the asymmetric one -- which is why the
    # author_association check is the load-bearing guard here rather than a
    # belt-and-braces addition. Comment events ALWAYS run in the base repo's
    # context WITH secrets; unlike fork pull_request runs, GitHub does not
    # withhold them. On a public repo that means any stranger commenting
    # "@claude" would spend this repo's API key. OWNER-only fails closed before a
    # runner is even allocated. (The action also has an allowed_non_write_users
    # input, but a guard here costs nothing and does not depend on the action
    # behaving correctly.)
    #
    # The pull_request.issue check keeps this to PR comments; a plain issue
    # comment is not a review request.
    #
    # SYS-021 req. 4 is still satisfied, and by a smaller surface than before:
    # the fail-open event is guarded, and the fail-closed one no longer exists.
    #
    # Two guards were REMOVED with the pull_request trigger on 2026-07-26, and
    # what they protected is worth recording so neither is re-added by reflex if
    # an automatic pass ever returns:
    #   - the same-repo fork check (fork PRs get no secrets, so the run would die
    #     on auth and greet a contributor with a red X they cannot fix), and
    #   - the `user.type != 'Bot'` check (the action refuses bot-authored PRs
    #     outright and exits 1, so every Dependabot bump used to allocate a
    #     runner, authenticate, and fail).
    # Both are now unreachable rather than unnecessary. Dependabot bumps still go
    # unreviewed, as ADR-016 already accepted -- now because nothing fires, not
    # because a guard skips. An OWNER commenting @claude on a bump still works.
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    # Keyed on the PR number, NOT github.ref: on issue_comment events github.ref is the
    # default branch, so a ref-keyed group would put every @claude comment across every
    # PR into one group and let them cancel each other.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    # Backstop only -- this greens the RUN, not the CHECK. See the step-level
    # continue-on-error below, which is the one that actually enforces advisory
    # status. Kept because it still covers a failure with no step to attach to
    # (runner death, a failing checkout).
    #
    # SYS-021 req. 3 as originally written named only this placement, and this
    # repo was recorded as compliant on that basis. It was not: measured on PR
    # #123 (run 30141009937) the run concluded `success` while the `review` check
    # run concluded `failure`, so the red X reached the PR anyway. SYS-021
    # Amendment 1 corrects the requirement; this is the fix.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      # THE placement that enforces advisory status. `jobs.<id>.continue-on-error`
      # stops a failing job from failing the RUN; `steps[*].continue-on-error`
      # stops a failing step from failing the JOB -- and the job's conclusion is
      # what GitHub publishes as the check run the PR displays. Only this one
      # keeps a non-deterministic reviewer's bad day off the checks list.
      - uses: anthropics/claude-code-action@v1
        continue-on-error: true
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request for correctness, security, and adherence to the
            conventions in CLAUDE.md.

            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            Start by reading the diff (`gh pr diff`). Work out which files it actually
            touches, then check ONLY the items below that this diff could plausibly
            break -- open a file when the diff gives you a reason to, not to complete a
            checklist. A doc-only change needs almost none of them. Do not narrate the
            checks you skipped.

            This repo's headline claim is its measured eval numbers, so weight the
            review accordingly:
              - Changes to src/classify.py, src/gold_eval.py, or src/eval_gate.py that
                could move a published metric without a corresponding evals/ update.
              - Hardcoded model IDs that bypass the pinned constants (SYS-002 requires
                exact pinned IDs, no date suffixes). Two deliberate exceptions, do
                NOT flag them: src/classify_rag.py's RAG_MODEL and src/generate.py's
                MODEL both stay on claude-sonnet-4-6. That code is dormant, kept as
                the record after decisions/012 retired BM25 grounding; its old pin is
                what keeps the frozen comparison honest.
              - Eval numbers typed by hand into README.md or docs instead of coming
                from evals/metrics.json via the generator scripts.
              - New ADRs missing a "## Downstream surfaces" section.
              - Anything that would put non-public-domain text into data/ (ADR-015).

            Be specific and actionable. If the change is clean, say so briefly rather
            than manufacturing findings -- a review that always finds something trains
            the reader to skip it.

            Post the review with `gh pr comment` for top-level findings, and
            mcp__github_inline_comment__create_inline_comment (with confirmed: true)
            for anything tied to a specific line. Reviewing without posting is a
            no-op -- the comment IS the deliverable.
          # --model pinned per SYS-002 (exact ID, no date suffix). --max-turns bounds
          # the agentic loop so a pathological diff cannot run up an unbounded bill.
          #
          # --allowedTools is NOT optional and its absence fails SILENTLY. Without it the
          # first live run went green in 36s, spent $0.14 over 7 turns, and posted
          # nothing: every attempt to comment became one of 6 permission denials, which
          # are not job failures. A review lane that reviews and cannot speak looks
          # exactly like a healthy one from the checks list.
          #
          # Read/Grep/Glob added 2026-07-25 as a fast-follow from kb-agent (its ADR-008).
          # The prompt above asks about src/classify.py, evals/metrics.json and the
          # dormant model pins, so it needs file access. This lane had only ever been
          # exercised on small doc-only PRs, which is why the gap had not surfaced --
          # on kb-agent the same narrow grant produced 12 denials, a hit turn cap and
          # nothing posted the first time a prompt actually required reading source.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 20
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          use_sticky_comment: true
          classify_inline_comments: true
